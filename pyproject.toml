[project]
name = "kuronuri"
version = "0.1.0"
description = "Black out sensitive text in PDFs with a local decision model"
readme = "README.md"
authors = [
    { name = "yacchin1205", email = "968739+yacchin1205@users.noreply.github.com" }
]
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "ginza>=5.3.0",
    "httpx>=0.28.1",
    "ja-ginza>=5.3.0",
    "pymupdf>=1.26,<2",
]

[project.scripts]
kuronuri = "kuronuri.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
